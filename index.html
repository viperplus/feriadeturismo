<title>Feria de Turismo - ESRN RURAL Virtual</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#0d1117;font-family:"Segoe UI",Arial,sans-serif;color:#fff}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;
       background:radial-gradient(circle at 50% 32%,#20375a 0%,#0d1117 72%);padding:24px}
  #badge{font-size:11px;letter-spacing:5px;color:#8fffc4;border:1px solid rgba(143,255,196,.4);
         border-radius:999px;padding:6px 16px}
  h1{font-size:clamp(26px,5vw,48px);letter-spacing:4px;
     background:linear-gradient(90deg,#7bdff2,#efef7a,#ff9f6e,#7bdff2);background-size:300% 100%;
     -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
  @keyframes shine{to{background-position:300% 0}}
  p{color:#b9c6d6;line-height:1.6;max-width:560px}
  a{display:inline-block;border-radius:999px;padding:15px 34px;font-size:17px;font-weight:700;letter-spacing:1px;
    color:#06121f;text-decoration:none;background:linear-gradient(90deg,#6ee7ff,#8fffc4);
    box-shadow:0 8px 30px rgba(110,231,255,.35);transition:transform .15s}
  a:hover{transform:scale(1.05)}
</style>
</head>
<body>
  <div id="badge">ESRN RURAL VIRTUAL</div>
  <h1>FERIA DE TURISMO</h1>
  <p>Entrando a la muestra 3D…<br>
